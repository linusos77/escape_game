
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Escape Tetris 2.3 FINAL</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
min-height:100%;
background:#050505;
overflow-x:hidden;
overflow-y:auto;
font-family:monospace;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
color:#00ff88;
}

#wrap{
text-align:center;
padding:10px;
width:100%;
max-width:430px;
margin:auto;
}

h1{
margin:0 0 10px;
letter-spacing:3px;
text-shadow:0 0 12px #00ff88;
}

#game{
position:relative;
display:inline-block;
max-width:100%;
}

canvas{
display:block;
background:#111;
border:4px solid #00ff88;
box-shadow:0 0 20px #00ff88;
image-rendering:pixelated;
width:min(240px, calc(100vw - 28px));
height:auto;
touch-action:none;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}

#game::after{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:
repeating-linear-gradient(
transparent 0px,
transparent 3px,
rgba(255,255,255,.04) 4px
);
}

#start,#overlay{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

#start{
background:rgba(0,0,0,.88);
}

#overlay{
font-size:96px;
font-weight:bold;
color:gold;
opacity:0;
pointer-events:none;
}

#overlay.show{
animation:reveal 2s;
}

@keyframes reveal{
0%{
opacity:0;
transform:scale(.5);
}
20%{
opacity:1;
transform:scale(1.2);
text-shadow:-4px 0 red,4px 0 cyan,0 0 25px gold;
}
100%{
opacity:0;
}
}

.glitch{
animation:shake .35s;
}

@keyframes shake{
25%{transform:translate(-4px,2px);}
75%{transform:translate(4px,-2px);}
}

#buttons{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

button{
background:#111;
color:#00ff88;
border:2px solid #00ff88;
padding:10px 16px;
font-family:inherit;
font-size:16px;
cursor:pointer;
}

button:active{
background:#00ff88;
color:#000;
}

#touch{
display:flex;
justify-content:center;
gap:12px;
margin-top:15px;
}

.touch{
width:clamp(44px, 16vw, 68px);
height:clamp(44px, 16vw, 68px);
border-radius:16px;
border:3px solid #00ff88;
background:#111;
color:#00ff88;
font-size:30px;
font-weight:bold;
touch-action:none;
}

.touch:active{
background:#00ff88;
color:black;
transform:scale(.95);
}

small{
color:#888;
}

@media (hover:hover) and (pointer:fine){
#touch{
display:none;
}
}

/* Responsive: Spielfeld nach verfügbarer Höhe und Breite skalieren. */
#c { width: var(--board-width, 240px); max-width:100%; aspect-ratio:1/2; }
#wrap { padding:6px 8px; }
h1 { font-size:clamp(17px, 4.5vw, 24px); margin-bottom:6px; }
#buttons { margin-top:6px; gap:8px; }
#buttons button { padding:7px 10px; font-size:clamp(12px, 3.2vw, 16px); }
#touch { margin-top:8px; gap:clamp(6px, 2vw, 12px); }
#touch .touch { font-size:clamp(22px, 6vw, 30px); padding:0; }
#wrap p { margin:7px 0 0; font-size:11px; }
#overlay { font-size:clamp(44px, 18vw, 96px); }
@media (max-height:650px) {
  #wrap { padding-top:3px; padding-bottom:3px; }
  h1 { margin-bottom:3px; }
  #touch { margin-top:5px; }
  #touch .touch { width:clamp(40px, 11vh, 58px); height:clamp(40px, 11vh, 58px); }
  #wrap p { margin-top:3px; }
}
@media (max-height:440px) and (orientation:landscape) {
  #wrap { max-width:720px; display:grid; grid-template-columns:1fr auto 1fr; gap:4px 12px; align-items:center; }
  h1 { grid-column:1; grid-row:1; }
  #game { grid-column:2; grid-row:1 / span 5; }
  #status { grid-column:1; grid-row:2; }
  #msg { grid-column:1; grid-row:3; }
  #buttons { grid-column:1; grid-row:4; flex-wrap:wrap; }
  #touch { grid-column:3; grid-row:1 / span 4; display:grid; grid-template-columns:repeat(2, 1fr); }
  #help { grid-column:1 / -1; grid-row:6; }
}
</style>
</head>

<body>

<div id="wrap">

<h1>ESCAPE TETRIS</h1>

<div id="game">

<canvas id="c" width="240" height="480"></canvas>

<div id="overlay">67</div>

<div id="start">

<div style="font-size:22px">INSERT TOKEN</div>

<button id="startBtn" style="margin-top:18px">
START
</button>

</div>

</div>

<div id="status" style="margin-top:5px">

ZEILEN: <span id="lines">0</span>

</div>

<div id="msg"
style="height:22px;color:gold"></div>

<div id="buttons">

<button id="newGame">NEUES SPIEL</button>

<button id="back">ZURÜCK</button>

</div>

<div id="touch">

<button class="touch" id="left">⬅</button>

<button class="touch" id="rotate">⟳</button>

<button class="touch" id="right">➡</button>

<button class="touch" id="down">⬇</button>

</div>

<p id="help"><small>
PC: Pfeiltasten · Handy: Touch-Tasten
</small></p>

</div>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

const SIZE=24;
const W=10;
const H=20;

const COLORS=[
"",
"#F1C40F",
"#9B59B6",
"#00D2FF",
"#E74C3C",
"#2ECC71",
"#3498DB"
];

const SHAPES=[
[[1,1],[1,1]],
[[2,2,2],[0,2,0]],
[[3,3,3,3]],
[[4,4,0],[0,4,4]],
[[0,5,5],[5,5,0]],
[[6,0,0],[6,6,6]]
];

let board=[];
let piece;
let px=0;
let py=0;

let timer=null;

let started=false;
let paused=false;

let lines=0;
let unlocked=false;

function clone(m){
return JSON.parse(JSON.stringify(m));
}

function startGame(){

clearInterval(timer);

board=Array.from(
{length:H},
()=>Array(W).fill(0)
);

lines=0;
unlocked=false;
started=true;
paused=false;

document.getElementById("lines").textContent="0";
document.getElementById("msg").textContent="";
document.getElementById("start").style.display="none";

spawn();
draw();

timer=setInterval(step,500);

}

function backToStart(){

clearInterval(timer);

started=false;
paused=false;

const s=document.getElementById("start");

s.style.display="flex";

s.innerHTML=
"<div style='font-size:22px'>INSERT TOKEN</div><button id='startBtn' style='margin-top:18px'>START</button>";

document.getElementById("startBtn").onclick=startGame;

ctx.fillStyle="#111";
ctx.fillRect(0,0,240,480);

}

function spawn(){

piece=clone(
SHAPES[
Math.floor(Math.random()*SHAPES.length)
]
);

px=((W-piece[0].length)/2)|0;
py=0;

if(hit()) gameOver();

}

function gameOver(){

clearInterval(timer);

started=false;

const s=document.getElementById("start");

s.style.display="flex";

s.innerHTML=
"<div style='font-size:22px'>GAME OVER</div><button id='startBtn' style='margin-top:18px'>NOCHMAL</button>";

document.getElementById("startBtn").onclick=startGame;

}

function hit(nx=px,ny=py,np=piece){

for(let y=0;y<np.length;y++)
for(let x=0;x<np[y].length;x++){

if(!np[y][x]) continue;

const gx=nx+x;
const gy=ny+y;

if(gx<0||gx>=W||gy>=H)
return true;

if(gy>=0&&board[gy][gx])
return true;

}

return false;

}

function merge(){

for(let y=0;y<piece.length;y++)
for(let x=0;x<piece[y].length;x++)
if(piece[y][x])
board[py+y][px+x]=piece[y][x];

}

function clearRows(){

let removed=0;

for(let y=H-1;y>=0;y--){

if(board[y].every(Boolean)){

board.splice(y,1);
board.unshift(Array(W).fill(0));

removed++;
y++;

}

}

if(removed){

lines+=removed;

document.getElementById("lines").textContent=lines;

if(lines>=3&&!unlocked){

unlocked=true;
secret();

}

}

}

function secret(){

paused=true;

document.getElementById("game").classList.add("glitch");
document.getElementById("overlay").classList.add("show");

document.getElementById("msg").textContent="SYSTEM ERROR";

setTimeout(()=>{
document.getElementById("msg").textContent="CODEFRAGMENT GEFUNDEN";
},900);

setTimeout(()=>{

document.getElementById("game").classList.remove("glitch");
document.getElementById("overlay").classList.remove("show");
document.getElementById("msg").textContent="";

paused=false;

},2200);

}

/* ---------- ROTATION MIT WALL KICK ---------- */

function rotate(){

const h=piece.length;
const w=piece[0].length;

const rotated=
Array.from(
{length:w},
()=>Array(h).fill(0)
);

for(let y=0;y<h;y++)
for(let x=0;x<w;x++)
rotated[x][h-1-y]=piece[y][x];

const tests=[
[0,0],
[-1,0],
[1,0],
[-2,0],
[2,0],
[0,-1]
];

for(const [dx,dy] of tests){

if(!hit(px+dx,py+dy,rotated)){

piece=rotated;
px+=dx;
py+=dy;

draw();
return;

}

}

}

/* ---------- ENDE ROTATION ---------- */

function moveLeft(){

if(started&&!paused&&!hit(px-1,py)){
px--;
draw();
}

}

function moveRight(){

if(started&&!paused&&!hit(px+1,py)){
px++;
draw();
}

}

function moveDown(){

if(started&&!paused){

py++;

if(hit())
py--;

draw();

}

}
function step(){

if(!started || paused) return;

py++;

if(hit()){

py--;

merge();

clearRows();

spawn();

}

draw();

}

function cell(x,y,v){

ctx.fillStyle=COLORS[v];

ctx.fillRect(
x*SIZE,
y*SIZE,
SIZE,
SIZE
);

ctx.strokeStyle="#222";

ctx.strokeRect(
x*SIZE,
y*SIZE,
SIZE,
SIZE
);

}

function draw(){

ctx.fillStyle="#111";

ctx.fillRect(
0,
0,
240,
480
);

for(let y=0;y<H;y++)
for(let x=0;x<W;x++)
if(board[y][x])
cell(x,y,board[y][x]);

if(piece)
for(let y=0;y<piece.length;y++)
for(let x=0;x<piece[y].length;x++)
if(piece[y][x])
cell(px+x,py+y,piece[y][x]);

}

/* ---------------- PC ---------------- */

document.addEventListener("keydown",e=>{

if(e.key==="Enter"&&!started){

startGame();

return;

}

if(!started||paused) return;

switch(e.key){

case"ArrowLeft":
moveLeft();
break;

case"ArrowRight":
moveRight();
break;

case"ArrowUp":
rotate();
break;

case"ArrowDown":
moveDown();
break;

}

});

/* ---------- Safari Canvas Schutz ---------- */

["touchstart","touchmove"].forEach(type=>{

canvas.addEventListener(type,function(e){

e.preventDefault();

},{passive:false});

});

/* ---------- Pointer Events (Android + iPhone) ---------- */

function bind(id,fn){

const el=document.getElementById(id);

/* Moderne Geräte */

if(window.PointerEvent){

el.addEventListener("pointerup",function(e){

e.preventDefault();
fn();

});

}

/* Fallback für ältere iPhones */

else{

el.addEventListener("touchend",function(e){

e.preventDefault();
fn();

},{passive:false});

el.addEventListener("click",fn);

}

}

/* Touch-Steuerung */

bind("left",moveLeft);
bind("right",moveRight);
bind("rotate",rotate);
bind("down",moveDown);

/* Buttons */

document.getElementById("startBtn").onclick=startGame;
document.getElementById("newGame").onclick=startGame;
document.getElementById("back").onclick=backToStart;


/* Die tatsächliche Canvas-Auflösung bleibt 240 × 480: nur die Anzeige skaliert. */
function fitBoard(){
  const wrap=document.getElementById('wrap');
  const game=document.getElementById('game');
  const landscape=window.matchMedia('(orientation: landscape) and (max-height: 440px)').matches;
  const availableHeight=window.visualViewport ? window.visualViewport.height : window.innerHeight;
  let other=0;
  if(landscape){
    other=12;
  } else {
    for(const child of wrap.children){
      if(child===game) continue;
      const style=getComputedStyle(child);
      if(style.display==='none') continue;
      const rect=child.getBoundingClientRect();
      other+=rect.height+parseFloat(style.marginTop||0)+parseFloat(style.marginBottom||0);
    }
    other+=18;
  }
  const maxByHeight=Math.max(110,(availableHeight-other)/2);
  const maxByWidth=landscape ? Math.max(110,window.innerWidth*.38) : window.innerWidth-28;
  const width=Math.min(240,maxByHeight,maxByWidth);
  document.documentElement.style.setProperty('--board-width',width+'px');
}
window.addEventListener('resize',fitBoard);
window.addEventListener('orientationchange',fitBoard);
if(window.visualViewport) window.visualViewport.addEventListener('resize',fitBoard);
fitBoard();

/* Erstes Bild zeichnen */

draw();

</script>

</body>
</html>
